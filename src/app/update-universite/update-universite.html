<div class="container">
<div>
<h2>Modifier une université :</h2>
</div>
<form >
<div  class="col-sm-2 col-md-2 col-lg-2">
<label >ID Université</label>
<input type="number" [(ngModel)]="currentUniversite.iduniversite" name="iduniversite" class="form-control" readonly>
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Nom Université</label>
<input type="text"[(ngModel)]= " currentUniversite.nomuniversite" name="nomuniversite" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Ville université</label>
<input type="text"[(ngModel)]= " currentUniversite.villeuniversite" name="villeuniversite" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Nombre des étudiants</label>
<input type="number"[(ngModel)]= " currentUniversite.nombre_etudiants" name="nombre_etudiants" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Date de Création</label>
<input type="date"[(ngModel)]= " currentUniversite.dateCreation" name="dateCreation" class="form-control">
</div>
<div class="mt-2">
<button type="submit" (click)="updateuniversite()"class="btn btn-success">Modifier</button>
</div>  
</form>
</div>
