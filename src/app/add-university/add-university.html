<div class="container">
<div>
<h2>Ajouter une université :</h2>
</div>
<form >
<div class="col-sm-2 col-md-2 col-lg-2">
<label >ID Université</label>
<input type="number" [(ngModel)]="newuniversite.iduniversite" name="iduniversite" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Nom Université</label>
<input type="text"[(ngModel)]= "newuniversite.nomuniversite" name="nomuniversite" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Ville université</label>
<input type="text"[(ngModel)]= "newuniversite.villeuniversite" name="villeuniversite" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Nombre des étudiants</label>
<input type="number"[(ngModel)]= "newuniversite.nombre_etudiants" name="nombre_etudiants" class="form-control">
</div>
<div class="col-sm-4 col-md-4 col-lg-4" >
<label >Date de Création</label>
<input type="date"[(ngModel)]= "newuniversite.dateCreation" name="dateCreation" class="form-control">
</div>
<div class="mt-2">
<button type="submit" (click)="addUniversity()"class="btn btn-success">Ajouter</button>
</div>
<div class="mt-2">
        <h3>{{message}}</h3>
 </div>   
</form>
</div>
